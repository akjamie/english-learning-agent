name: agentic-repo-change
version: 1
description: Enterprise Agentic SDLC repo-local change - proposal -> specs -> review -> (design) -> tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: WHY this change is needed
    template: proposal.md
    instruction: |
      Create the proposal document establishing WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity.
      - **What Changes**: specific new capabilities / modifications / removals.
        Mark breaking changes with **BREAKING**.
      - **Capabilities**: which OpenSpec spec deltas will be created/modified.
        Each listed capability needs a corresponding specs/**/*.md file.
      - **Impact**: affected code, APIs, dependencies, systems.
      - **System Design refs**: if this change touches a cross-repo contract,
        reference the System Design version(s) here (e.g.
        payment-settlement@v2). Leave empty if none.

      Keep it 1-2 pages. Focus on WHY, not HOW. Implementation belongs in
      design.md. The Repo-local Spec (spec.md) is the approved intent and must
      not be restated here.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Approved intent - behavior contract for this repo
    template: spec.md
    instruction: |
      Create the Repo-local Spec delta(s). This is the enterprise APPROVED
      INTENT artifact, not an implementation plan.

      If the proposal referenced a System Design, every requirement here must
      be consistent with that design's contracts.md. Do NOT restate the System
      Design; reference it by version.

      Include observable behavior, inputs/outputs, error conditions, external
      constraints (security/privacy/reliability/compatibility), and testable
      scenarios. If this repo consumes a cross-repo contract, add acceptance
      criteria that can be checked by a contract/integration test.

      Exclude internal class/function names, library choices, and step-by-step
      implementation - those belong in design.md or tasks.md.

      Format (OpenSpec delta):
      - `## ADDED Requirements` / `## MODIFIED Requirements` /
        `## REMOVED Requirements` / `## RENAMED Requirements`
      - Each requirement: `### Requirement: <name>` (use SHALL/MUST)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN (exactly 4 `#`)
      - New capabilities: first section is `## Purpose` (50+ chars)
      - Every requirement MUST have at least one scenario.

      IMPORTANT: once approved (PR merged), spec.md is IMMUTABLE. Do not edit
      it to reflect execution state - that is what tasks.md is for.
    requires:
      - proposal

  - id: review
    generates: review.md
    description: Independent fresh-context review output (read-only)
    template: review.md
    instruction: |
      You are an INDEPENDENT reviewer with a FRESH CONTEXT, different from the
      Draft agent. You MUST NOT modify spec.md, design.md, or tasks.md. Your
      only output is review.md.

      Review these dimensions and give a verdict per dimension
      (PASS / CONCERN / FAIL):
      - Completeness: are all requirements covered, with scenarios?
      - Ambiguity: any requirement that cannot be tested as written?
      - Cross-repo consistency: if a System Design is referenced, does the spec
        contradict its contracts.md / sequencing.md?
      - Contract impact: are consumer-facing changes called out?
      - Testability: does every AC map to a concrete test?
      - Security: any unaddressed auth/data/secret concern?

      Also produce a requirement -> implementation -> test mapping table
      (implementation/test may be TBD pre-code; AC must be listed).

      End with an explicit overall verdict: APPROVE / NEEDS_REVISION, and a
      list of blocking findings. Do not rubber-stamp; if something is unclear,
      say so.
    requires:
      - specs

  - id: design
    generates: design.md
    description: Repo-internal technical design (HOW)
    template: design.md
    instruction: |
      Create the repo-internal technical design. Create this only if the change
      is cross-cutting within the repo, introduces a new pattern/dependency, or
      has migration/security/perf complexity. Skip for trivial changes.

      Sections:
      - **Context**: current state and constraints needed to explain the approach.
      - **Goals / Non-Goals**: design-level boundaries only.
      - **Decisions**: key technical choices + rationale + alternatives considered.
      - **Risks / Trade-offs**: format [Risk] -> Mitigation.
      - **Migration Plan**: deploy steps, rollback (if applicable).

      Do NOT restate requirements from spec.md - reference them.
      Do NOT make cross-repo design decisions here; those belong to the
      System Design. If you find one is needed, raise it as an Amendment
      request instead of absorbing it.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Mutable execution checklist
    template: tasks.md
    instruction: |
      Create the implementation checklist. tasks.md is MUTABLE EXECUTION STATE
      and is NOT part of approved intent - never edit spec.md to mark progress.

      Resolve any design.md Open Questions that would change what gets built
      before writing tasks.

      Format:
      - Group related tasks under `## N. <group>` headings
      - Every task is a checkbox: `- [ ] N.M <description>`
      - Each task states how to verify completion (test/command/artifact) in
        its own description
      - Each group lands its own tests and docs; no final catch-all test group
      - Order by dependency
    requires:
      - specs
      - review

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    Pause on blockers or ambiguity. Do NOT modify spec.md (approved intent).
    Report any discovered gap: low-risk repo-local fix -> append a task;
    cross-repo contract change -> stop and raise a System Design Amendment.
